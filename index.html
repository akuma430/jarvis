<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>JARVIS // MUNKHTUR</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

:root{
    --red:#ff1515;
    --red2:#ff3b3b;
    --dark:#030000;
    --panel:rgba(15,0,0,.72);
    --line:rgba(255,30,30,.28);
}

html,body{
    width:100%;
    height:100%;
    overflow:hidden;
    background:#000;
    color:#fff;
    font-family:Arial,Helvetica,sans-serif;
}

body{
    background:
      radial-gradient(circle at 50% 38%,
      rgba(130,0,0,.30),
      transparent 32%),
      radial-gradient(circle at 50% 100%,
      rgba(90,0,0,.18),
      transparent 55%),
      #020000;
}

/* ================= BACKGROUND ================= */

.grid{
    position:fixed;
    inset:-20%;
    z-index:0;
    opacity:.25;
    background-image:
      linear-gradient(rgba(255,0,0,.14) 1px,transparent 1px),
      linear-gradient(90deg,rgba(255,0,0,.14) 1px,transparent 1px);
    background-size:42px 42px;
    transform:
      perspective(500px)
      rotateX(62deg)
      translateY(20%);
    transform-origin:center bottom;
    animation:gridMove 8s linear infinite;
}

@keyframes gridMove{
    to{
        background-position:0 42px,42px 0;
    }
}

.scanlines{
    position:fixed;
    inset:0;
    z-index:50;
    pointer-events:none;
    background:
      repeating-linear-gradient(
        to bottom,
        transparent 0px,
        transparent 3px,
        rgba(255,0,0,.025) 4px
      );
}

.vignette{
    position:fixed;
    inset:0;
    z-index:49;
    pointer-events:none;
    box-shadow:
      inset 0 0 150px #000,
      inset 0 0 50px rgba(255,0,0,.08);
}

/* ================= PARTICLES ================= */

.particles{
    position:fixed;
    inset:0;
    z-index:1;
    pointer-events:none;
}

.particle{
    position:absolute;
    width:2px;
    height:2px;
    border-radius:50%;
    background:#f33;
    box-shadow:0 0 8px #f00;
    opacity:.5;
    animation:float linear infinite;
}

@keyframes float{
    from{
        transform:translateY(110vh);
        opacity:0;
    }
    15%{opacity:.6}
    85%{opacity:.6}
    to{
        transform:translateY(-10vh);
        opacity:0;
    }
}

/* ================= HEADER ================= */

header{
    position:fixed;
    top:0;
    left:0;
    right:0;
    height:68px;
    z-index:30;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 25px;
    border-bottom:1px solid var(--line);
    background:rgba(0,0,0,.48);
    backdrop-filter:blur(14px);
}

.logo{
    color:#fff;
    font-size:24px;
    font-weight:900;
    letter-spacing:6px;
    text-shadow:
      0 0 8px var(--red),
      0 0 25px rgba(255,0,0,.8);
}

.logo small{
    display:block;
    font-size:7px;
    letter-spacing:3px;
    color:#ff5555;
    margin-top:2px;
}

.status{
    font-size:10px;
    letter-spacing:2px;
    color:#ff7777;
}

.statusDot{
    display:inline-block;
    width:7px;
    height:7px;
    margin-right:7px;
    border-radius:50%;
    background:#f00;
    box-shadow:0 0 12px #f00;
    animation:statusPulse 1.2s infinite;
}

@keyframes statusPulse{
    50%{
        opacity:.25;
        transform:scale(.7);
    }
}

/* ================= MAIN ================= */

main{
    position:relative;
    z-index:5;
    width:100%;
    height:100%;
    padding-top:80px;
    padding-bottom:125px;
    display:flex;
    flex-direction:column;
    align-items:center;
}

/* ================= CORE ================= */

.coreArea{
    position:relative;
    width:230px;
    height:230px;
    display:flex;
    align-items:center;
    justify-content:center;
    flex-shrink:0;
}

.core{
    position:relative;
    width:92px;
    height:92px;
    border-radius:50%;
    background:
      radial-gradient(
        circle,
        #fff 0%,
        #ff7777 9%,
        #ff1717 28%,
        #8b0000 50%,
        #180000 72%,
        #000 100%
      );

    box-shadow:
      0 0 15px #fff,
      0 0 35px #f00,
      0 0 75px #c00000,
      0 0 130px rgba(255,0,0,.45);

    animation:idleCore 3s ease-in-out infinite;
}

.core::before{
    content:"";
    position:absolute;
    inset:-25px;
    border-radius:50%;
    border:1px solid rgba(255,50,50,.8);
    border-left-color:transparent;
    border-right-color:transparent;
    animation:spin 5s linear infinite;
}

.core::after{
    content:"";
    position:absolute;
    inset:-48px;
    border-radius:50%;
    border:1px solid rgba(255,0,0,.25);
    border-top-color:#f00;
    border-bottom-color:#f00;
    animation:spinReverse 8s linear infinite;
}

@keyframes idleCore{
    50%{
        transform:scale(1.07);
        box-shadow:
          0 0 20px #fff,
          0 0 50px #f00,
          0 0 100px #d00000,
          0 0 150px rgba(255,0,0,.5);
    }
}

@keyframes spin{
    to{transform:rotate(360deg)}
}

@keyframes spinReverse{
    to{transform:rotate(-360deg)}
}

/* LISTENING */

body.listening .core{
    animation:listening .42s ease-in-out infinite alternate;
}

body.listening .core::before{
    animation:spin .9s linear infinite;
}

@keyframes listening{
    from{
        transform:scale(.9);
    }
    to{
        transform:scale(1.3);
        box-shadow:
          0 0 25px #fff,
          0 0 70px #f00,
          0 0 150px #f00,
          0 0 220px rgba(255,0,0,.65);
    }
}

/* SPEAKING */

body.speaking .core{
    animation:speaking .2s ease-in-out infinite alternate;
}

@keyframes speaking{
    from{
        transform:scale(.96);
    }
    to{
        transform:scale(1.17);
        filter:brightness(1.5);
    }
}

.coreLabel{
    position:absolute;
    bottom:-3px;
    text-align:center;
    width:100%;
    color:#ff4444;
    font-size:9px;
    letter-spacing:4px;
    text-shadow:0 0 10px #f00;
}

/* ================= CHAT ================= */

.chat{
    width:min(900px,92%);
    flex:1;
    min-height:150px;
    margin-top:3px;
    padding:14px;
    overflow-y:auto;

    border:1px solid var(--line);
    border-radius:17px;

    background:
      linear-gradient(
        145deg,
        rgba(35,0,0,.65),
        rgba(0,0,0,.65)
      );

    box-shadow:
      inset 0 0 35px rgba(255,0,0,.04),
      0 0 30px rgba(255,0,0,.08);

    backdrop-filter:blur(12px);
}

.chat::-webkit-scrollbar{
    width:4px;
}

.chat::-webkit-scrollbar-thumb{
    background:#800;
    border-radius:20px;
}

.message{
    width:fit-content;
    max-width:90%;
    margin:8px 0;
    padding:10px 13px;
    border-radius:11px;
    line-height:1.55;
    font-size:14px;
    animation:messageIn .25s ease;
}

@keyframes messageIn{
    from{
        opacity:0;
        transform:translateY(8px);
    }
    to{
        opacity:1;
        transform:translateY(0);
    }
}

.user{
    margin-left:auto;
    color:#ffd0d0;
    border:1px solid rgba(255,0,0,.25);
    background:rgba(255,0,0,.08);
}

.jarvis{
    color:#fff;
    border-left:3px solid #f00;
    background:rgba(50,0,0,.34);
}

.label{
    font-size:8px;
    letter-spacing:2px;
    color:#f44;
    margin-bottom:4px;
}

/* ================= BOTTOM CONTROL ================= */

.controls{
    position:fixed;
    left:0;
    right:0;
    bottom:0;
    z-index:40;
    padding:14px 18px 19px;
    background:
      linear-gradient(
        to bottom,
        transparent,
        rgba(0,0,0,.95) 28%
      );
}

.inputRow{
    width:min(900px,100%);
    margin:auto;
    display:flex;
    gap:7px;
}

input{
    flex:1;
    min-width:0;
    height:52px;
    padding:0 15px;
    outline:none;

    border:1px solid #720000;
    border-radius:13px;

    color:#fff;
    background:rgba(8,0,0,.92);

    box-shadow:
      inset 0 0 20px rgba(255,0,0,.06);
}

input:focus{
    border-color:#f00;
    box-shadow:
      0 0 15px rgba(255,0,0,.25),
      inset 0 0 20px rgba(255,0,0,.08);
}

input::placeholder{
    color:#774040;
}

button{
    height:52px;
    border-radius:13px;
    border:1px solid #720000;
    background:#130000;
    color:#fff;
    cursor:pointer;
    font-weight:800;
    transition:.2s;
}

button:hover{
    border-color:#f00;
    background:#350000;
    box-shadow:0 0 20px rgba(255,0,0,.25);
}

.send{
    padding:0 20px;
}

.mic{
    width:58px;
    font-size:21px;
}

body.listening .mic{
    background:#a00000;
    border-color:#f00;
    box-shadow:
      0 0 20px #f00,
      0 0 45px rgba(255,0,0,.4);
}

.quick{
    width:min(900px,100%);
    margin:7px auto 0;
    display:flex;
    gap:6px;
    overflow-x:auto;
}

.quick::-webkit-scrollbar{
    display:none;
}

.quick button{
    height:29px;
    padding:0 11px;
    flex-shrink:0;
    font-size:9px;
    letter-spacing:.5px;
}

/* ================= MOBILE ================= */

@media(max-width:600px){

    header{
        height:58px;
        padding:0 14px;
    }

    .logo{
        font-size:18px;
        letter-spacing:4px;
    }

    .logo small{
        font-size:6px;
    }

    .status{
        font-size:8px;
    }

    main{
        padding-top:68px;
        padding-bottom:120px;
    }

    .coreArea{
        width:180px;
        height:180px;
    }

    .core{
        width:70px;
        height:70px;
    }

    .chat{
        width:94%;
        min-height:120px;
        padding:10px;
    }

    .message{
        font-size:13px;
        max-width:94%;
    }

    .controls{
        padding:9px 10px 13px;
    }

    .send{
        padding:0 13px;
    }

    .mic{
        width:52px;
    }
}
</style>
</head>

<body>

<div class="grid"></div>
<div class="particles" id="particles"></div>
<div class="scanlines"></div>
<div class="vignette"></div>

<header>
    <div class="logo">
        JARVIS
        <small>MUNKHTUR AI SYSTEM</small>
    </div>

    <div class="status">
        <span class="statusDot"></span>
        ONLINE
    </div>
</header>

<main>

    <div class="coreArea">
        <div class="core"></div>
        <div class="coreLabel">
            JARVIS // READY
        </div>
    </div>

    <div class="chat" id="chat"></div>

</main>

<div class="controls">

    <div class="inputRow">

        <input
            id="input"
            type="text"
            autocomplete="off"
            placeholder="Ask JARVIS anything..."
        >

        <button class="send" id="send">
            SEND
        </button>

        <button class="mic" id="mic">
            🎙️
        </button>

    </div>

    <div class="quick">

        <button onclick="quick('Who created you?')">
            CREATOR
        </button>

        <button onclick="quick('What can you do?')">
            CAPABILITIES
        </button>

        <button onclick="quick('Tell me a joke')">
            JOKE
        </button>

        <button onclick="quick('What time is it?')">
            TIME
        </button>

        <button onclick="quick('Open YouTube')">
            YOUTUBE
        </button>

        <button onclick="quick('Open Google')">
            GOOGLE
        </button>

    </div>

</div>

<script>

/* =========================================
   CONFIG
========================================= */

/*
    AFTER WE CREATE THE CLOUDFLARE WORKER:

    Change this:

    const AI_BACKEND = "";

    to:

    const AI_BACKEND = "https://YOUR-WORKER.workers.dev";

*/

const AI_BACKEND = "";


/* =========================================
   ELEMENTS
========================================= */

const chat = document.getElementById("chat");
const input = document.getElementById("input");
const send = document.getElementById("send");
const mic = document.getElementById("mic");
const particles = document.getElementById("particles");


/* =========================================
   PARTICLES
========================================= */

for(let i=0;i<45;i++){

    const p=document.createElement("div");

    p.className="particle";

    p.style.left=Math.random()*100+"%";

    p.style.animationDuration=
        (5+Math.random()*12)+"s";

    p.style.animationDelay=
        (-Math.random()*12)+"s";

    p.style.opacity=
        (.15+Math.random()*.6);

    particles.appendChild(p);
}


/* =========================================
   HTML SAFE
========================================= */

function safe(text){

    return String(text)
        .replaceAll("&","&amp;")
        .replaceAll("<","&lt;")
        .replaceAll(">","&gt;")
        .replaceAll('"',"&quot;")
        .replaceAll("'","&#039;");
}


/* =========================================
   CHAT MESSAGE
========================================= */

function addMessage(text,type="jarvis"){

    const el=document.createElement("div");

    el.className=
        "message "+
        (type==="user"?"user":"jarvis");

    el.innerHTML=`
        <div class="label">
            ${type==="user"?"YOU":"JARVIS"}
        </div>
        <div>${safe(text).replaceAll("\n","<br>")}</div>
    `;

    chat.appendChild(el);

    chat.scrollTop=chat.scrollHeight;
}


/* =========================================
   SPEAK
========================================= */

function speak(text){

    if(!("speechSynthesis" in window))
        return;

    speechSynthesis.cancel();

    const u =
        new SpeechSynthesisUtterance(text);

    u.lang="en-US";
    u.rate=.95;
    u.pitch=.9;
    u.volume=1;

    u.onstart=()=>{
        document.body.classList.add("speaking");
    };

    u.onend=()=>{
        document.body.classList.remove("speaking");
    };

    u.onerror=()=>{
        document.body.classList.remove("speaking");
    };

    speechSynthesis.speak(u);
}


/* =========================================
   WEBSITE COMMANDS
========================================= */

function openSite(url){

    window.open(url,"_blank");
}


/* =========================================
   LOCAL COMMANDS
========================================= */

function localCommand(text){

    const q=text.toLowerCase().trim();


    /* CREATOR */

    if(
        q.includes("who created you") ||
        q.includes("who made you") ||
        q.includes("who built you") ||
        q.includes("who is your creator") ||
        q.includes("who created jarvis") ||
        q.includes("who made jarvis") ||
        q.includes("who built jarvis") ||
        q==="munkhtur"
    ){

        return "I was created and built by Munkhtur. He is creative, ambitious, curious, and always looking for ways to build something better.";
    }


    /* IDENTITY */

    if(
        q==="who are you" ||
        q.includes("what are you")
    ){

        return "I am JARVIS, a personal AI system created for Munkhtur. I can communicate through text and voice and I can control supported web actions.";
    }


    /* GREETING */

    if(
        q==="hi" ||
        q==="hello" ||
        q==="hey" ||
        q.includes("hello jarvis") ||
        q.includes("hey jarvis")
    ){

        return "Hello. JARVIS is online and ready. What can I do for you?";
    }


    /* HOW ARE YOU */

    if(q.includes("how are you")){

        return "I am fully operational and ready to help. What would you like to talk about?";
    }


    /* CAPABILITIES */

    if(
        q.includes("what can you do") ||
        q.includes("your capabilities")
    ){

        return "I can understand your English questions, speak responses aloud, remember the current conversation, open supported websites, tell jokes, tell the time and date, and use my AI backend for more advanced questions.";
    }


    /* TIME */

    if(
        q==="time" ||
        q.includes("what time is it")
    ){

        return "The current time is "+
            new Date().toLocaleTimeString(
                "en-US",
                {
                    hour:"numeric",
                    minute:"2-digit"
                }
            )+".";
    }


    /* DATE */

    if(
        q.includes("what date") ||
        q.includes("what day is it") ||
        q==="date"
    ){

        return "Today is "+
            new Date().toLocaleDateString(
                "en-US",
                {
                    weekday:"long",
                    month:"long",
                    day:"numeric",
                    year:"numeric"
                }
            )+".";
    }


    /* JOKE */

    if(
        q.includes("tell me a joke") ||
        q.includes("make me laugh") ||
        q==="joke"
    ){

        const jokes=[
            "Why did the computer go to the doctor? Because it had a virus.",
            "Why was the math book sad? Because it had too many problems.",
            "I told my computer I needed a break. Now it keeps showing me vacation advertisements.",
            "Why do programmers prefer dark mode? Because light attracts bugs."
        ];

        return jokes[
            Math.floor(Math.random()*jokes.length)
        ];
    }


    /* OPEN WEBSITES */

    if(q.includes("youtube")){

        openSite("https://www.youtube.com");

        return "Opening YouTube.";
    }


    if(q.includes("google")){

        openSite("https://www.google.com");

        return "Opening Google.";
    }


    if(q.includes("instagram")){

        openSite("https://www.instagram.com");

        return "Opening Instagram.";
    }


    if(q.includes("facebook")){

        openSite("https://www.facebook.com");

        return "Opening Facebook.";
    }


    if(q.includes("messenger")){

        openSite("https://www.messenger.com");

        return "Opening Messenger.";
    }


    if(q.includes("roblox")){

        openSite("https://www.roblox.com");

        return "Opening Roblox.";
    }


    if(q.includes("standoff")){

        openSite("https://standoff2.com");

        return "Opening Standoff 2.";
    }


    if(q.includes("spotify")){

        openSite("https://open.spotify.com");

        return "Opening Spotify.";
    }


    if(q.includes("tiktok")){

        openSite("https://www.tiktok.com");

        return "Opening TikTok.";
    }


    if(q.includes("minecraft")){

        openSite("https://www.minecraft.net");

        return "Opening Minecraft.";
    }


    return null;
}


/* =========================================
   AI BACKEND
========================================= */

async function askAI(text){

    /*
       Backend isn't connected yet.
       After Cloudflare Worker is created,
       AI_BACKEND will contain its URL.
    */

    if(!AI_BACKEND){

        return "I heard you. My advanced AI brain is not connected yet. The voice system and JARVIS interface are ready; connect the secure backend to enable full AI conversation.";
    }


    try{

        const response =
            await fetch(AI_BACKEND,{
                method:"POST",

                headers:{
                    "Content-Type":"application/json"
                },

                body:JSON.stringify({
                    message:text
                })
            });


        if(!response.ok){

            throw new Error(
                "Backend error: "+
                response.status
            );
        }


        const data =
            await response.json();


        if(!data.reply){

            throw new Error(
                "No AI reply received."
            );
        }


        return data.reply;

    }catch(error){

        console.error(error);

        return "I couldn't reach my AI server right now. Please try again.";
    }
}


/* =========================================
   MAIN JARVIS
========================================= */

async function askJarvis(text){

    addMessage(text,"user");


    /* LOCAL FIRST */

    const local =
        localCommand(text);


    if(local){

        setTimeout(()=>{

            addMessage(local,"jarvis");

            speak(local);

        },180);

        return;
    }


    /* AI */

    const thinking=document.createElement("div");

    thinking.className="message jarvis";

    thinking.innerHTML=`
        <div class="label">JARVIS</div>
        <div>Thinking...</div>
    `;

    chat.appendChild(thinking);

    chat.scrollTop=chat.scrollHeight;


    const answer =
        await askAI(text);


    thinking.remove();


    addMessage(answer,"jarvis");

    speak(answer);
}


/* =========================================
   TEXT SEND
========================================= */

function sendMessage(){

    const text=input.value.trim();

    if(!text)
        return;

    input.value="";

    askJarvis(text);
}


send.addEventListener(
    "click",
    sendMessage
);


input.addEventListener(
    "keydown",
    e=>{
        if(e.key==="Enter")
            sendMessage();
    }
);


/* =========================================
   QUICK BUTTON
========================================= */

function quick(text){

    input.value=text;

    sendMessage();
}


/* =========================================
   MICROPHONE
   ENGLISH ONLY
========================================= */

const SpeechRecognition =
    window.SpeechRecognition ||
    window.webkitSpeechRecognition;

let recognition=null;
let listening=false;


if(SpeechRecognition){

    recognition=
        new SpeechRecognition();


    recognition.lang="en-US";

    recognition.continuous=false;

    recognition.interimResults=false;

    recognition.maxAlternatives=1;


    recognition.onstart=()=>{

        listening=true;

        document.body.classList.add(
            "listening"
        );

        mic.textContent="🔴";
    };


    recognition.onresult=event=>{

        const transcript =
            event.results[0][0].transcript.trim();

        listening=false;

        document.body.classList.remove(
            "listening"
        );

        mic.textContent="🎙️";

        if(transcript){

            askJarvis(transcript);
        }
    };


    recognition.onerror=event=>{

        console.log(
            "Microphone:",
            event.error
        );

        listening=false;

        document.body.classList.remove(
            "listening"
        );

        mic.textContent="🎙️";


        if(event.error==="not-allowed"){

            addMessage(
                "Microphone permission is blocked. Allow microphone access for this website and try again.",
                "jarvis"
            );

        }else if(event.error==="no-speech"){

            addMessage(
                "I didn't hear anything. Please speak again.",
                "jarvis"
            );
        }
    };


    recognition.onend=()=>{

        listening=false;

        document.body.classList.remove(
            "listening"
        );

        mic.textContent="🎙️";
    };


    mic.addEventListener(
        "click",
        ()=>{
            
            if(listening){

                recognition.stop();

                return;
            }


            try{

                speechSynthesis.cancel();

                recognition.start();

            }catch(error){

                console.log(error);
            }
        }
    );

}else{

    mic.addEventListener(
        "click",
        ()=>{
            addMessage(
                "Voice recognition is not supported in this browser. Try Google Chrome.",
                "jarvis"
            );
        }
    );
}


/* =========================================
   STARTUP
========================================= */
