<!DOCTYPE html>
<html lang="mn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>JARVIS AI — Munkhtur</title>

<script src="https://js.puter.com/v2/"></script>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

html,body{
  width:100%;
  height:100%;
  overflow:hidden;
  font-family:Arial,sans-serif;
  background:#02050a;
  color:#dffcff;
}

/* BACKGROUND */
body{
  background:
    radial-gradient(circle at 50% 45%,rgba(0,220,255,.16),transparent 25%),
    radial-gradient(circle at 10% 20%,rgba(0,100,255,.12),transparent 30%),
    radial-gradient(circle at 90% 80%,rgba(0,255,255,.08),transparent 30%),
    #02050a;
}

body:before{
  content:"";
  position:fixed;
  inset:0;
  background:
    linear-gradient(rgba(0,255,255,.035) 1px,transparent 1px),
    linear-gradient(90deg,rgba(0,255,255,.035) 1px,transparent 1px);
  background-size:45px 45px;
  animation:grid 15s linear infinite;
  pointer-events:none;
}

@keyframes grid{
  from{transform:translate(0,0)}
  to{transform:translate(45px,45px)}
}

/* PARTICLES */
.particles{
  position:fixed;
  inset:0;
  pointer-events:none;
  overflow:hidden;
}

.particles i{
  position:absolute;
  width:2px;
  height:2px;
  background:#7fffff;
  border-radius:50%;
  box-shadow:0 0 8px #00eaff;
  animation:float linear infinite;
}

@keyframes float{
  from{
    transform:translateY(110vh);
    opacity:0;
  }
  20%{opacity:1}
  80%{opacity:1}
  to{
    transform:translateY(-10vh);
    opacity:0;
  }
}

/* HEADER */
header{
  position:absolute;
  top:22px;
  left:28px;
  right:28px;
  display:flex;
  justify-content:space-between;
  z-index:20;
}

.logo{
  font-size:25px;
  font-weight:bold;
  letter-spacing:7px;
  color:#8ffcff;
  text-shadow:0 0 20px #00eaff;
}

.status{
  font-size:11px;
  letter-spacing:3px;
  color:#54ffd7;
}

.dot{
  display:inline-block;
  width:8px;
  height:8px;
  border-radius:50%;
  background:#00ffbf;
  box-shadow:0 0 15px #00ffbf;
  margin-right:7px;
}

/* CORE */
.coreArea{
  position:absolute;
  left:40%;
  top:45%;
  width:390px;
  height:390px;
  transform:translate(-50%,-50%);
}

.core{
  position:absolute;
  left:50%;
  top:50%;
  width:105px;
  height:105px;
  transform:translate(-50%,-50%);
  border-radius:50%;

  background:
    radial-gradient(circle,
      white 0%,
      #bfffff 8%,
      #00eaff 30%,
      #006aff 55%,
      transparent 72%);

  box-shadow:
    0 0 25px #00eaff,
    0 0 70px #00bfff,
    0 0 140px rgba(0,210,255,.55);

  animation:pulse 2.2s infinite ease-in-out;
}

@keyframes pulse{
  0%,100%{
    transform:translate(-50%,-50%) scale(.9);
  }
  50%{
    transform:translate(-50%,-50%) scale(1.12);
  }
}

.ring{
  position:absolute;
  left:50%;
  top:50%;
  border-radius:50%;
  transform:translate(-50%,-50%);
  border:1px solid rgba(0,230,255,.5);
}

.r1{
  width:155px;
  height:155px;
  animation:spin 7s linear infinite;
}

.r2{
  width:230px;
  height:230px;
  border-style:dashed;
  animation:reverseSpin 12s linear infinite;
}

.r3{
  width:315px;
  height:315px;
  border-color:rgba(0,150,255,.25);
  animation:spin 18s linear infinite;
}

.r4{
  width:375px;
  height:375px;
  border-color:rgba(0,255,255,.12);
  animation:reverseSpin 25s linear infinite;
}

@keyframes spin{
  to{
    transform:translate(-50%,-50%) rotate(360deg);
  }
}

@keyframes reverseSpin{
  to{
    transform:translate(-50%,-50%) rotate(-360deg);
  }
}

/* LISTENING */
body.listening .core{
  animation:listen .45s infinite alternate;
}

body.listening .ring{
  animation-duration:2s;
}

@keyframes listen{
  from{
    transform:translate(-50%,-50%) scale(.8);
    box-shadow:0 0 25px #00eaff;
  }
  to{
    transform:translate(-50%,-50%) scale(1.3);
    box-shadow:
      0 0 50px #00eaff,
      0 0 130px #00d9ff;
  }
}

/* SPEAKING */
body.speaking .core{
  animation:speak .3s infinite alternate;
}

@keyframes speak{
  from{
    transform:translate(-50%,-50%) scale(.85);
  }
  to{
    transform:translate(-50%,-50%) scale(1.2);
  }
}

/* CHAT */
.chat{
  position:absolute;
  right:25px;
  top:80px;
  bottom:25px;
  width:390px;

  display:flex;
  flex-direction:column;

  background:rgba(2,12,20,.78);
  border:1px solid rgba(0,220,255,.28);
  border-radius:20px;

  backdrop-filter:blur(20px);

  box-shadow:
    0 0 50px rgba(0,200,255,.08),
    inset 0 0 40px rgba(0,220,255,.03);

  z-index:15;
}

.chatTitle{
  padding:18px;
  border-bottom:1px solid rgba(0,220,255,.18);
  color:#70f8ff;
  font-size:11px;
  letter-spacing:3px;
}

.messages{
  flex:1;
  overflow-y:auto;
  padding:15px;
}

.messages::-webkit-scrollbar{
  width:4px;
}

.messages::-webkit-scrollbar-thumb{
  background:#00cfe8;
}

.msg{
  padding:12px;
  margin-bottom:12px;
  border-radius:12px;
  font-size:14px;
  line-height:1.55;
  white-space:pre-wrap;
}

.user{
  background:rgba(0,130,255,.13);
  border:1px solid rgba(0,170,255,.2);
}

.ai{
  background:rgba(0,255,220,.05);
  border:1px solid rgba(0,255,220,.13);
}

.label{
  font-size:9px;
  letter-spacing:2px;
  opacity:.5;
  margin-bottom:5px;
}

/* INPUT */
.controls{
  display:flex;
  gap:7px;
  padding:12px;
  border-top:1px solid rgba(0,220,255,.16);
}

input{
  flex:1;
  min-width:0;
  padding:12px;

  border-radius:10px;
  border:1px solid rgba(0,220,255,.25);

  outline:none;

  background:#031018;
  color:white;
}

input:focus{
  border-color:#00eaff;
  box-shadow:0 0 15px rgba(0,220,255,.18);
}

button{
  border:1px solid rgba(0,230,255,.35);
  background:rgba(0,180,255,.08);
  color:#8ffcff;

  border-radius:10px;
  padding:0 13px;

  cursor:pointer;
}

button:hover{
  background:rgba(0,220,255,.2);
  box-shadow:0 0 15px rgba(0,220,255,.25);
}

.mic{
  width:50px;
  font-size:18px;
}

/* MOBILE */
@media(max-width:800px){

  .coreArea{
    left:50%;
    top:28%;
    transform:translate(-50%,-50%) scale(.55);
  }

  .chat{
    left:10px;
    right:10px;
    top:auto;
    bottom:10px;
    width:auto;
    height:52vh;
  }

  .logo{
    font-size:18px;
    letter-spacing:4px;
  }

  header{
    left:15px;
    right:15px;
    top:15px;
  }
}
</style>
</head>

<body>

<div class="particles" id="particles"></div>

<header>
  <div class="logo">J.A.R.V.I.S</div>

  <div class="status">
    <span class="dot"></span>
    ONLINE
  </div>
</header>

<!-- CORE -->
<div class="coreArea">
  <div class="ring r4"></div>
  <div class="ring r3"></div>
  <div class="ring r2"></div>
  <div class="ring r1"></div>
  <div class="core"></div>
</div>

<!-- CHAT -->
<div class="chat">

  <div class="chatTitle">
    JARVIS // MUNKHTUR AI SYSTEM
  </div>

  <div class="messages" id="messages">

    <div class="msg ai">
      <div class="label">JARVIS</div>
Hello. I am JARVIS.

Ask me anything.
    </div>

  </div>

  <div class="controls">

    <input
      id="input"
      type="text"
      placeholder="Ask anything..."
      autocomplete="off"
    >

    <button id="send">SEND</button>

    <button class="mic" id="mic">🎙️</button>

  </div>

</div>


<script>

/* =========================
   PARTICLES
========================= */

const particleBox =
  document.getElementById("particles");

for(let i=0;i<70;i++){

  const p =
    document.createElement("i");

  p.style.left =
    Math.random()*100 + "%";

  p.style.animationDuration =
    (8 + Math.random()*15) + "s";

  p.style.animationDelay =
    (-Math.random()*20) + "s";

  particleBox.appendChild(p);
}


/* =========================
   ELEMENTS
========================= */

const input =
  document.getElementById("input");

const send =
  document.getElementById("send");

const mic =
  document.getElementById("mic");

const messages =
  document.getElementById("messages");


/* =========================
   JARVIS SYSTEM
========================= */

const SYSTEM_PROMPT = `

You are JARVIS, an advanced personal AI assistant.

Your creator is Munkhtur.

If the user asks who created, built, made or developed you or JARVIS,
say that Munkhtur created and built you.

Be intelligent, friendly, calm and futuristic.

Understand Mongolian written in Latin letters with typos,
for example:
sain uu
ene yu ve
yaj hiih ve
heden tugrug ve
haana bdg ve

If the user speaks Mongolian, answer in Mongolian.

If the user speaks English, answer in English.

Answer general questions about:
science
technology
school
math
history
geography
sports
NBA
football
games
Minecraft
Roblox
Standoff 2
coding
programming
English
Mongolian
movies
music
space
animals
cars
bikes
and everyday life.

For difficult questions, explain clearly and step by step.

Do not invent facts.

If you are uncertain, say that you are uncertain.

Be conversational rather than robotic.

`;


/* =========================
   ADD MESSAGE
========================= */

function addMessage(text,type){

  const div =
    document.createElement("div");

  div.className =
    "msg " + type;

  const label =
    type === "user"
      ? "YOU"
      : "JARVIS";

  div.innerHTML =
    '<div class="label">' +
    label +
    '</div>' +
    escapeHTML(text);

  messages.appendChild(div);

  messages.scrollTop =
    messages.scrollHeight;
}


/* =========================
   SAFE TEXT
========================= */

function escapeHTML(text){

  return String(text)
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;");
}


/* =========================
   VOICE OUTPUT
========================= */

function speak(text){

  if(!window.speechSynthesis)
    return;

  speechSynthesis.cancel();

  const clean =
    String(text)
      .replace(/[*#`]/g,"")
      .slice(0,5000);

  const voice =
    new SpeechSynthesisUtterance(clean);

  voice.lang =
    /[а-яА-ЯөӨүҮ]/.test(clean)
      ? "mn-MN"
      : "en-US";

  voice.rate = 0.95;
  voice.pitch = 0.9;
  voice.volume = 1;

  voice.onstart = () =>{
    document.body.classList.add("speaking");
  };

  voice.onend = () =>{
    document.body.classList.remove("speaking");
  };

  speechSynthesis.speak(voice);
}


/* =========================
   LOCAL COMMANDS
========================= */

function localCommand(text){

  const t =
    text.toLowerCase().trim();


  /* CREATOR */

  if(
    t.includes("who created you") ||
    t.includes("who made you") ||
    t.includes("who built you") ||
    t.includes("who is your creator") ||
    t.includes("who created jarvis") ||
    t.includes("who made jarvis") ||
    t.includes("who built jarvis") ||
    t.includes("hen chamaig hiisen") ||
    t.includes("chamaig hen hiisen") ||
    t.includes("munkhtur")
  ){

    return `
I was created and built by Munkhtur.

Munkhtur is the creator behind this JARVIS system.
He built it with creativity, ambition and technology.
    `.trim();
  }


  /* GREETING */

  if(
    t === "hi" ||
    t === "hello" ||
    t.includes("sain uu") ||
    t.includes("sain baina uu")
  ){

    return "Hello. JARVIS is online. How can I help you?";
  }


  /* TIME */

  if(
    t.includes("what time") ||
    t.includes("time now") ||
    t.includes("tsag hed")
  ){

    return "The current time is " +
      new Date().toLocaleTimeString();
  }


  /* DATE */

  if(
    t.includes("today") ||
    t.includes("what date") ||
    t.includes("onoodor")
  ){

    return "Today is " +
      new Date().toLocaleDateString();
  }


  /* JOKE */

  if(
    t.includes("joke") ||
    t.includes("joke please") ||
    t.includes("togloom yari") ||
    t.includes("ineelge")
  ){

    const jokes = [

      "Why did the computer go to the doctor? Because it had a virus. 😂",

      "Why was the math book sad? Because it had too many problems. 🤖",

      "I told my computer I needed a break. Now it keeps showing me KitKat ads. 😎"

    ];

    return jokes[
      Math.floor(
        Math.random()*jokes.length
      )
    ];
  }


  return null;
}


/* =========================
   WEBSITE COMMANDS
========================= */

function openWebsite(text){

  const t =
    text.toLowerCase();

  const sites = {

    youtube:"https://www.youtube.com",

    google:"https://www.google.com",

    facebook:"https://www.facebook.com",

    instagram:"https://www.instagram.com",

    messenger:"https://www.messenger.com",

    roblox:"https://www.roblox.com",

    tiktok:"https://www.tiktok.com",

    spotify:"https://open.spotify.com",

    minecraft:"https://www.minecraft.net",

    standoff:"https://standoff2.com"

  };


  for(const name in sites){

    if(
      t.includes("open " + name) ||
      t.includes("go to " + name) ||
      t.includes("нээ " + name) ||
      t.includes(name + " нээ")
    ){

      window.open(
        sites[name],
        "_blank"
      );

      return true;
    }
  }

  return false;
}


/* =========================
   AI REQUEST
========================= */

async function askAI(question){

  /* LOCAL */

  const local =
    localCommand(question);

  if(local){

    addMessage(local,"ai");
    speak(local);

    return;
  }


  /* WEBSITE */

  if(openWebsite(question)){

    const answer =
      "Opening it now.";

    addMessage(answer,"ai");
    speak(answer);

    return;
  }


  /* THINKING */

  const thinking =
    document.createElement("div");

  thinking.className =
    "msg ai";

  thinking.innerHTML =
    '<div class="label">JARVIS</div>Thinking...';

  messages.appendChild(thinking);

  messages.scrollTop =
    messages.scrollHeight;


  try{

    const response =
      await puter.ai.chat(

        [
          {
            role:"system",
            content:SYSTEM_PROMPT
          },
          {
            role:"user",
            content:question
          }
        ],

        {
          model:"gpt-5"
        }

      );


    thinking.remove();


    let answer = "";


    if(
      response &&
      response.message &&
      response.message.content
    ){

      answer =
        response.message.content;

    }

    else if(
      response &&
      response.content
    ){

      answer =
        response.content;

    }

    else{

      answer =
        String(response);

    }


    addMessage(
      answer,
      "ai"
    );

    speak(answer);

  }

  catch(error){

    console.error(error);

    thinking.remove();

    const errorText =
      "Sorry, I couldn't connect to the AI right now. Please try again.";

    addMessage(
      errorText,
      "ai"
    );

    speak(errorText);

  }
}


/* =========================
   SEND
========================= */

async function sendMessage(){

  const text =
    input.value.trim();

  if(!text)
    return;

  addMessage(
    text,
    "user"
  );

  input.value = "";

  await askAI(text);
}


send.onclick =
  sendMessage;


input.addEventListener(
  "keydown",
  function(e){

    if(e.key === "Enter")
      sendMessage();

  }
);


/* =========================
   MICROPHONE
========================= */

const SpeechRecognition =
  window.SpeechRecognition ||
  window.webkitSpeechRecognition;

let recognition = null;

let listening = false;


if(SpeechRecognition){

  recognition =
    new SpeechRecognition();

  recognition.continuous = false;

  recognition.interimResults = false;

  /*
    Монгол хэлээр сонсоно.
    Хэрэв English их ярьдаг бол
    en-US болгож болно.
  */

  recognition.lang = "mn-MN";


  recognition.onstart = function(){

    listening = true;

    document.body.classList.add(
      "listening"
    );

    mic.textContent = "🔴";

  };


  recognition.onresult =
    function(event){

      const text =
        event.results[0][0].transcript;

      input.value =
        text;

      document.body.classList.remove(
        "listening"
      );

      listening = false;

      mic.textContent =
        "🎙️";

      sendMessage();

    };


  recognition.onerror =
    function(event){

      console.log(
        "Microphone:",
        event.error
      );

      listening = false;

      document.body.classList.remove(
        "listening"
      );

      mic.textContent =
        "🎙️";

    };


  recognition.onend =
    function(){

      listening = false;

      document.body.classList.remove(
        "listening"
      );

      mic.textContent =
        "🎙️";

    };


  mic.onclick =
    function(){

      if(listening){

        recognition.stop();

        return;
      }

      try{

        recognition.start();

      }

      catch(error){

        console.log(error);

      }

    };

}

else{

  mic.onclick =
    function(){

      alert(
        "Microphone voice recognition is not supported by this browser. Please use Google Chrome."
      );

    };

}


/* =========================
   START
========================= */

setTimeout(
  function(){

    const welcome =
      "JARVIS online. How can I help you?";

    speak(welcome);

  },
  1000
);

</script>

</body>
    </html>
