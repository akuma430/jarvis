<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#020202">
<title>J.A.R.V.I.S // MUNKHTUR</title>

<style>
:root{
  --r:#ff2020;
  --r2:#8b0000;
  --bg:#020202;
  --panel:rgba(8,4,4,.82);
  --line:rgba(255,25,25,.25);
  --txt:#eee;
  --muted:#777;
}

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

html,body{
  width:100%;
  height:100%;
  overflow:hidden;
  background:var(--bg);
  color:var(--txt);
  font-family:Arial,Helvetica,sans-serif;
}

body{
  isolation:isolate;
}

/* ---------- BACKGROUND ---------- */

#space{
  position:fixed;
  inset:0;
  width:100%;
  height:100%;
  z-index:0;
  pointer-events:none;
}

.vignette{
  position:fixed;
  inset:0;
  z-index:1;
  pointer-events:none;
  background:
    radial-gradient(
      circle at center,
      transparent 35%,
      rgba(0,0,0,.5) 100%
    );
}

.scan{
  position:fixed;
  inset:0;
  z-index:2;
  pointer-events:none;
  opacity:.1;
  background:
    repeating-linear-gradient(
      0deg,
      transparent 0,
      transparent 3px,
      rgba(255,0,0,.08) 4px
    );
}

/* ---------- APP ---------- */

.app{
  position:relative;
  z-index:5;
  width:100%;
  height:100%;
  display:flex;
  flex-direction:column;
}

/* ---------- HEADER ---------- */

.header{
  height:62px;
  flex:none;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 18px;
  background:rgba(0,0,0,.7);
  border-bottom:1px solid var(--line);
  backdrop-filter:blur(10px);
}

.logo{
  color:#ff2424;
  font-size:18px;
  font-weight:900;
  letter-spacing:4px;
  text-shadow:0 0 14px red;
}

.sub{
  color:#666;
  font-size:8px;
  letter-spacing:2px;
  margin-top:3px;
}

.online{
  display:flex;
  align-items:center;
  gap:7px;
  font-size:8px;
  color:#888;
  letter-spacing:2px;
}

.dot{
  width:7px;
  height:7px;
  border-radius:50%;
  background:#f00;
  box-shadow:0 0 12px red;
}

/* ---------- MAIN ---------- */

.main{
  flex:1;
  min-height:0;
  display:flex;
  flex-direction:column;
  align-items:center;
}

/* ---------- HOLOGRAM ---------- */

.holo{
  height:275px;
  width:100%;
  flex:none;
  display:flex;
  align-items:center;
  justify-content:center;
  position:relative;
  perspective:700px;
}

.holoCore{
  width:108px;
  height:108px;
  border-radius:50%;
  position:relative;
  display:flex;
  align-items:center;
  justify-content:center;

  background:
    radial-gradient(
      circle,
      #ffb0b0 0%,
      #ff3030 9%,
      #b00000 25%,
      #300000 50%,
      #050000 72%
    );

  border:2px solid #ff2222;

  box-shadow:
    0 0 18px #f00,
    0 0 55px rgba(255,0,0,.7),
    inset 0 0 28px #f00;

  animation:core 2.5s ease-in-out infinite;
}

.holoCore:before,
.holoCore:after{
  content:"";
  position:absolute;
  border-radius:50%;
  border:1px solid rgba(255,0,0,.65);
  pointer-events:none;
}

.holoCore:before{
  width:155px;
  height:155px;
  border-left-color:transparent;
  border-right-color:transparent;
  animation:spin 4s linear infinite;
}

.holoCore:after{
  width:205px;
  height:205px;
  border-top-color:transparent;
  border-bottom-color:transparent;
  animation:spinReverse 7s linear infinite;
}

.coreText{
  font-size:10px;
  letter-spacing:3px;
  font-weight:bold;
  text-shadow:0 0 10px white;
}

.holoLabel{
  position:absolute;
  bottom:25px;
  color:#777;
  font-size:8px;
  letter-spacing:3px;
}

@keyframes core{
  0%,100%{
    transform:scale(1);
  }
  50%{
    transform:scale(1.06);
  }
}

@keyframes spin{
  to{transform:rotate(360deg)}
}

@keyframes spinReverse{
  to{transform:rotate(-360deg)}
}

.holoCore.listen{
  animation:listen .42s infinite alternate;
}

.holoCore.speak{
  animation:speak .2s infinite alternate;
}

@keyframes listen{
  from{
    transform:scale(1);
    box-shadow:
      0 0 18px red,
      0 0 50px rgba(255,0,0,.6),
      inset 0 0 25px red;
  }
  to{
    transform:scale(1.18);
    box-shadow:
      0 0 35px red,
      0 0 100px rgba(255,0,0,.9),
      inset 0 0 40px red;
  }
}

@keyframes speak{
  from{transform:scale(.95)}
  to{transform:scale(1.17)}
}

/* ---------- TERMINAL ---------- */

.terminal{
  width:min(920px,94%);
  flex:1;
  min-height:0;
  display:flex;
  flex-direction:column;

  background:var(--panel);
  border:1px solid var(--line);
  border-radius:14px 14px 0 0;

  box-shadow:
    0 0 35px rgba(255,0,0,.08),
    inset 0 0 25px rgba(255,0,0,.025);

  backdrop-filter:blur(12px);
  overflow:hidden;
}

.termTop{
  height:40px;
  flex:none;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 13px;
  border-bottom:1px solid var(--line);
}

.termTitle{
  color:#f22;
  font-size:8px;
  letter-spacing:3px;
}

.termState{
  color:#666;
  font-size:8px;
  letter-spacing:2px;
}

.messages{
  flex:1;
  min-height:0;
  overflow-y:auto;
  padding:15px;
}

.messages::-webkit-scrollbar{
  width:3px;
}

.messages::-webkit-scrollbar-thumb{
  background:#600;
}

.msg{
  max-width:88%;
  width:fit-content;
  margin-bottom:12px;
  padding:10px 12px;
  border-radius:9px;
  font-size:13px;
  line-height:1.55;
  white-space:pre-wrap;
  word-break:break-word;
}

.msg.ai{
  border-left:2px solid red;
  background:rgba(255,0,0,.04);
  margin-right:auto;
}

.msg.user{
  border-right:2px solid red;
  background:rgba(255,0,0,.11);
  margin-left:auto;
}

.label{
  display:block;
  color:#f22;
  font-size:8px;
  letter-spacing:2px;
  margin-bottom:5px;
}

/* ---------- THINKING ---------- */

.thinking{
  display:flex;
  gap:5px;
}

.thinking span{
  width:5px;
  height:5px;
  border-radius:50%;
  background:red;
  animation:think .7s infinite alternate;
}

.thinking span:nth-child(2){
  animation-delay:.15s;
}

.thinking span:nth-child(3){
  animation-delay:.3s;
}

@keyframes think{
  from{
    opacity:.2;
    transform:translateY(0);
  }
  to{
    opacity:1;
    transform:translateY(-4px);
  }
}

/* ---------- INPUT ---------- */

.controls{
  width:min(920px,94%);
  flex:none;
  display:flex;
  gap:7px;
  padding:10px 0 13px;
}

.input{
  flex:1;
  min-width:0;
  height:46px;
  padding:0 13px;
  border-radius:9px;
  border:1px solid #430000;
  outline:none;
  background:#070707;
  color:white;
  font-size:13px;
}

.input:focus{
  border-color:red;
  box-shadow:0 0 14px rgba(255,0,0,.18);
}

button{
  height:46px;
  border-radius:9px;
  border:1px solid #650000;
  background:#130000;
  color:white;
  font-weight:bold;
  cursor:pointer;
}

button:active{
  transform:scale(.96);
}

#mic{
  width:50px;
  font-size:17px;
}

#mic.active{
  background:#800000;
  border-color:red;
  box-shadow:0 0 25px red;
}

#send{
  padding:0 16px;
}

/* ---------- MOBILE ---------- */

@media(max-width:600px){

  .header{
    height:56px;
    padding:0 13px;
  }

  .logo{
    font-size:14px;
    letter-spacing:2px;
  }

  .sub{
    font-size:6px;
  }

  .holo{
    height:220px;
  }

  .holoCore{
    width:88px;
    height:88px;
  }

  .holoCore:before{
    width:130px;
    height:130px;
  }

  .holoCore:after{
    width:165px;
    height:165px;
  }

  .msg{
    font-size:12px;
    max-width:93%;
  }

  .controls{
    width:94%;
  }

  #send{
    padding:0 12px;
  }

}

/* ---------- REDUCED MOTION ---------- */

@media(prefers-reduced-motion:reduce){

  *,
  *:before,
  *:after{
    animation-duration:.001ms!important;
    animation-iteration-count:1!important;
  }

}
</style>
</head>

<body>

<canvas id="space"></canvas>

<div class="vignette"></div>
<div class="scan"></div>

<div class="app">

<header class="header">

  <div>
    <div class="logo">J.A.R.V.I.S</div>
    <div class="sub">
      MUNKHTUR // ADVANCED SYSTEM
    </div>
  </div>

  <div class="online">
    <span class="dot"></span>
    ONLINE
  </div>

</header>

<main class="main">

<section class="holo">

  <div
    id="core"
    class="holoCore"
  >
    <div class="coreText">
      JARVIS
    </div>
  </div>

  <div
    id="mode"
    class="holoLabel"
  >
    SYSTEM READY
  </div>

</section>

<section class="terminal">

  <div class="termTop">

    <div class="termTitle">
      NEURAL INTERFACE
    </div>

    <div
      id="state"
      class="termState"
    >
      STANDBY
    </div>

  </div>

  <div
    id="messages"
    class="messages"
  ></div>

</section>

<div class="controls">

  <input
    id="input"
    class="input"
    autocomplete="off"
    placeholder="Ask JARVIS anything..."
  >

  <button
    id="mic"
    title="English microphone"
  >
    🎙
  </button>

  <button id="send">
    SEND
  </button>

</div>

</main>

</div>

<script>
/* =========================================================
   JARVIS V10
   ========================================================= */

/*
  AI BACKEND-ээ дараа нь энд оруулна.

  Жишээ:
  const AI_BACKEND =
  "https://your-worker.workers.dev";
*/

const AI_BACKEND = "";


/* =========================================================
   ELEMENTS
   ========================================================= */

const canvas =
  document.getElementById("space");

const ctx =
  canvas.getContext("2d",{
    alpha:true
  });

const core =
  document.getElementById("core");

const mode =
  document.getElementById("mode");

const state =
  document.getElementById("state");

const input =
  document.getElementById("input");

const send =
  document.getElementById("send");

const mic =
  document.getElementById("mic");

const messages =
  document.getElementById("messages");


/* =========================================================
   LIGHTWEIGHT 4D-STYLE PARTICLE ENGINE
   ========================================================= */

let W=0;
let H=0;
let dpr=1;

let particles=[];

const COUNT =
  innerWidth < 600 ? 45 : 70;

let animationRunning=true;

function resize(){

  dpr =
    Math.min(
      window.devicePixelRatio || 1,
      1.5
    );

  W =
    window.innerWidth;

  H =
    window.innerHeight;

  canvas.width =
    Math.floor(W*dpr);

  canvas.height =
    Math.floor(H*dpr);

  canvas.style.width =
    W+"px";

  canvas.style.height =
    H+"px";

  ctx.setTransform(
    dpr,0,0,dpr,0,0
  );

}

resize();

window.addEventListener(
  "resize",
  resize,
  {passive:true}
);


/* Generate virtual 4D coordinates */

for(
  let i=0;
  i<COUNT;
  i++
){

  particles.push({

    x:(Math.random()-.5)*2,

    y:(Math.random()-.5)*2,

    z:Math.random()*2+.2,

    w:(Math.random()-.5)*2,

    speed:
      .0004+
      Math.random()*.0012,

    size:
      .5+
      Math.random()*1.5

  });

}


/* ---------- ANIMATION ---------- */

let last=0;

function render(time){

  if(
    !animationRunning
  ){

    requestAnimationFrame(
      render
    );

    return;

  }


  /* FPS throttle */

  if(
    time-last < 28
  ){

    requestAnimationFrame(
      render
    );

    return;

  }

  last=time;


  ctx.clearRect(
    0,
    0,
    W,
    H
  );


  const cx =
    W*.5;

  const cy =
    H*.42;


  for(
    const p of particles
  ){

    /*
      Fake 4D rotation:
      W affects scale and depth.
    */

    p.w +=
      p.speed*1.5;

    if(p.w>1)
      p.w=-1;


    p.z -=
      p.speed*3;


    if(p.z<.15)
      p.z=2;


    const depth =
      p.z +
      p.w*.28;


    const scale =
      110 /
      Math.max(
        depth,
        .15
      );


    const x =
      cx +
      p.x*scale;

    const y =
      cy +
      p.y*scale;


    if(
      x<0 ||
      x>W ||
      y<0 ||
      y>H
    ) continue;


    const alpha =
      Math.max(
        .05,
        Math.min(
          .85,
          1/depth*.18
        )
      );


    ctx.globalAlpha =
      alpha;

    ctx.fillStyle =
      "#ff1515";

    ctx.beginPath();

    ctx.arc(
      x,
      y,
      p.size/
      Math.max(
        depth*.6,
        .4
      ),
      0,
      Math.PI*2
    );

    ctx.fill();

  }

  ctx.globalAlpha=1;

  requestAnimationFrame(
    render
  );

}

requestAnimationFrame(
  render
);


/* Pause heavy animation when tab hidden */

document.addEventListener(
  "visibilitychange",
  ()=>{
    animationRunning =
      !document.hidden;
  }
);


/* =========================================================
   CHAT
   ========================================================= */

let history=[];

function addMessage(
  text,
  type
){

  const el =
    document.createElement(
      "div"
    );

  el.className =
    "msg "+type;


  const label =
    document.createElement(
      "span"
    );

  label.className =
    "label";

  label.textContent =
    type==="user"
      ? "YOU"
      : "J.A.R.V.I.S";


  const content =
    document.createElement(
      "span"
    );

  content.textContent =
    text;


  el.appendChild(label);
  el.appendChild(content);

  messages.appendChild(el);

  messages.scrollTop =
    messages.scrollHeight;

}


/* =========================================================
   THINKING
   ========================================================= */

function thinking(){

  const el =
    document.createElement(
      "div"
    );

  el.id="thinking";

  el.className="msg ai";

  el.innerHTML=`
    <span class="label">J.A.R.V.I.S</span>
    <span class="thinking">
      <span></span>
      <span></span>
      <span></span>
    </span>
  `;

  messages.appendChild(el);

  messages.scrollTop =
    messages.scrollHeight;

}

function removeThinking(){

  const el =
    document.getElementById(
      "thinking"
    );

  if(el)
    el.remove();

}


/* =========================================================
   VOICE OUTPUT
   ========================================================= */

function speak(text){

  if(
    !("speechSynthesis" in window)
  )
    return;


  speechSynthesis.cancel();


  const u =
    new SpeechSynthesisUtterance(
      text
    );


  u.lang="en-US";

  u.rate=.94;

  u.pitch=.82;

  u.volume=1;


  u.onstart=()=>{

    core.classList.remove(
      "listen"
    );

    core.classList.add(
      "speak"
    );

    mode.textContent=
      "VOICE OUTPUT";

    state.textContent=
      "SPEAKING";

  };


  u.onend=()=>{

    core.classList.remove(
      "speak"
    );

    mode.textContent=
      "SYSTEM READY";

    state.textContent=
      "STANDBY";

  };


  speechSynthesis.speak(u);

}


function stopVoice(){

  if(
    "speechSynthesis" in window
  ){

    speechSynthesis.cancel();

  }

  core.classList.remove(
    "speak"
  );

  mode.textContent=
    "SYSTEM READY";

  state.textContent=
    "STANDBY";

}


/* =========================================================
   WEBSITE COMMANDS
   ========================================================= */

const sites={

  youtube:
    "https://www.youtube.com",

  google:
    "https://www.google.com",

  instagram:
    "https://www.instagram.com",

  facebook:
    "https://www.facebook.com",

  messenger:
    "https://www.messenger.com",

  tiktok:
    "https://www.tiktok.com",

  spotify:
    "https://open.spotify.com",

  roblox:
    "https://www.roblox.com",

  minecraft:
    "https://www.minecraft.net",

  "standoff 2":
    "https://standoff2.com"

};


function openSite(
  name
){

  window.open(
    sites[name],
    "_blank"
  );

}


/* =========================================================
   LOCAL COMMANDS
   ========================================================= */

function localCommand(
  raw
){

  const q =
    raw.toLowerCase().trim();


  /* creator */

  if(
    q.includes(
      "who created you"
    ) ||
    q.includes(
      "who made you"
    ) ||
    q.includes(
      "who built you"
    ) ||
    q.includes(
      "who is your creator"
    ) ||
    q.includes(
      "who created jarvis"
    )
  ){

    return `
I was created and built by Munkhtur.

Munkhtur is the creator of this J.A.R.V.I.S project. He designed this system as a futuristic personal AI assistant.
`.trim();

  }


  /* munkhtur */

  if(
    q==="munkhtur" ||
    q.includes(
      "tell me about munkhtur"
    )
  ){

    return `
Munkhtur is the creator of this J.A.R.V.I.S project. He is interested in technology, AI, coding, sports and creative projects.
`.trim();

  }


  /* identity */

  if(
    q==="who are you" ||
    q==="what are you"
  ){

    return `
I am J.A.R.V.I.S, a futuristic AI assistant created by Munkhtur.
`.trim();

  }


  /* time */

  if(
    q==="time" ||
    q.includes(
      "what time is it"
    )
  ){

    return (
      "The current time is "+
      new Date().toLocaleTimeString(
        "en-US",
        {
          hour:"numeric",
          minute:"2-digit"
        }
      )
    );

  }


  /* date */

  if(
    q==="date" ||
    q.includes(
      "what date is it"
    ) ||
    q.includes(
      "what is today's date"
    )
  ){

    return (
      "Today is "+
      new Date().toLocaleDateString(
        "en-US",
        {
          weekday:"long",
          year:"numeric",
          month:"long",
          day:"numeric"
        }
      )
    );

  }


  /* joke */

  if(
    q==="joke" ||
    q.includes(
      "tell me a joke"
    )
  ){

    const jokes=[

      "Why was the computer cold? It left its Windows open.",

      "Why did the programmer quit his job? He didn't get arrays.",

      "What do computers eat? Microchips.",

      "Why do programmers prefer dark mode? Because light attracts bugs."

    ];

    return jokes[
      Math.floor(
        Math.random()*
        jokes.length
      )
    ];

  }


  /* stop */

  if(
    q==="stop" ||
    q==="stop speaking" ||
    q==="be quiet"
  ){

    stopVoice();

    return "Voice output stopped.";

  }


  /* clear */

  if(
    q==="clear" ||
    q==="clear chat"
  ){

    messages.innerHTML="";

    history=[];

    return "Conversation cleared.";

  }


  /* websites */

  for(
    const name in sites
  ){

    if(
      q.includes(
        "open "+name
      )
    ){

      openSite(name);

      return (
        "Opening "+
        name+
        "."
      );

    }

  }


  return null;

}


/* =========================================================
   AI BACKEND
   ========================================================= */

async function askAI(
  question
){

  if(!AI_BACKEND){

    return `
My advanced AI brain is not connected yet.

The J.A.R.V.I.S interface, English microphone, voice system and command engine are ready. Connect the secure backend to answer unlimited questions.
`.trim();

  }


  try{

    const response =
      await fetch(
        AI_BACKEND,
        {
          method:"POST",

          headers:{
            "Content-Type":
              "application/json"
          },

          body:JSON.stringify({

            message:
              question,

            history:
              history

          })

        }
      );


    if(
      !response.ok
    ){

      throw new Error(
        "HTTP "+
        response.status
      );

    }


    const data =
      await response.json();


    return (
      data.reply ||
      data.output ||
      "The AI returned no response."
    );

  }
  catch(error){

    console.error(error);

    return `
Connection to my AI brain failed. Please check the backend.
`.trim();

  }

}


/* =========================================================
   MAIN ASK
   ========================================================= */

let busy=false;

async function ask(
  text
){

  text =
    text.trim();


  if(
    !text ||
    busy
  )
    return;


  addMessage(
    text,
    "user"
  );


  input.value="";


  /* Local command */

  const local =
    localCommand(text);


  if(local){

    addMessage(
      local,
      "ai"
    );

    speak(local);

    return;

  }


  /* AI */

  busy=true;

  send.disabled=true;

  mode.textContent=
    "NEURAL PROCESSING";

  state.textContent=
    "THINKING";


  thinking();


  const answer =
    await askAI(text);


  removeThinking();


  addMessage(
    answer,
    "ai"
  );


  history.push({

    role:"user",

    content:text

  });


  history.push({

    role:"assistant",

    content:answer

  });


  if(
    history.length>20
  ){

    history=
      history.slice(-20);

  }


  speak(answer);


  busy=false;

  send.disabled=false;

}


/* =========================================================
   SEND
   ========================================================= */

send.addEventListener(
  "click",
  ()=>{
    ask(input.value);
  }
);


/* =========================================================
   ENTER
   ========================================================= */

input.addEventListener(
  "keydown",
  e=>{

    if(
      e.key==="Enter"
    ){

      e.preventDefault();

      ask(input.value);

    }

  }
);


/* =========================================================
   ENGLISH MICROPHONE
   ========================================================= */

const Recognition =
  window.SpeechRecognition ||
  window.webkitSpeechRecognition;

let recognition=null;

let listening=false;


if(Recognition){

  recognition =
    new Recognition();


  recognition.lang=
    "en-US";


  recognition.continuous=
    false;


  recognition.interimResults=
    false;


  recognition.maxAlternatives=
    1;


  recognition.onstart=()=>{

    listening=true;

    mic.classList.add(
      "active"
    );

    core.classList.add(
      "listen"
    );

    mode.textContent=
      "LISTENING";

    state.textContent=
      "VOICE INPUT";

  };


  recognition.onresult=
    event=>{

      const text =
        event.results
          [0][0]
          .transcript;


      input.value=
        text;


      ask(text);

    };


  recognition.onerror=
    event=>{

      console.log(
        "Speech error:",
        event.error
      );

      listening=false;

      mic.classList.remove(
        "active"
      );

      core.classList.remove(
        "listen"
      );

      mode.textContent=
        "SYSTEM READY";

      state.textContent=
        "STANDBY";

    };


  recognition.onend=()=>{

    listening=false;

    mic.classList.remove(
      "active"
    );

    core.classList.remove(
      "listen"
    );

    if(
      !speechSynthesis.speaking
    ){

      mode.textContent=
        "SYSTEM READY";

      state.textContent=
        "STANDBY";

    }

  };


  mic.addEventListener(
    "click",
    ()=>{

      if(listening){

        recognition.stop();

        return;

      }


      try{

        recognition.start();

      }
      catch(e){

        console.log(e);

      }

    }
  );

}
else{

  mic.addEventListener(
    "click",
    ()=>{

      alert(
        "English voice recognition is not supported. Try Chrome."
      );

    }
  );

}


/* =========================================================
   ESC STOP
   ========================================================= */

document.addEventListener(
  "keydown",
  e=>{

    if(
      e.key==="Escape"
    ){

      stopVoice();

    }

  }
);


/* =========================================================
   STARTUP
   ========================================================= */

addMessage(
  "J.A.R.V.I.S online. Hello Munkhtur. Neural interface ready. Ask me anything.",
  "ai"
);

</script>
