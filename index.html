<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>JARVIS • Munkhtur AI</title>

<style>
*{box-sizing:border-box}

:root{
  --cyan:#00eaff;
  --blue:#008cff;
  --green:#00ff9d;
  --bg:#02060b;
  --panel:rgba(3,18,29,.72);
}

html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:var(--bg);
  color:var(--cyan);
  font-family:Arial,Helvetica,sans-serif;
}

body{
  background:
    radial-gradient(circle at 50% 35%,rgba(0,234,255,.12),transparent 30%),
    radial-gradient(circle at 50% 100%,rgba(0,100,255,.08),transparent 40%),
    #02060b;
}

body:before{
  content:"";
  position:fixed;
  inset:0;
  pointer-events:none;
  background:
    linear-gradient(rgba(0,234,255,.035) 1px,transparent 1px),
    linear-gradient(90deg,rgba(0,234,255,.035) 1px,transparent 1px);
  background-size:34px 34px;
  mask-image:linear-gradient(to bottom,black,transparent);
}

body:after{
  content:"";
  position:fixed;
  left:0;
  right:0;
  height:2px;
  background:linear-gradient(90deg,transparent,var(--cyan),transparent);
  opacity:.18;
  animation:scan 5s linear infinite;
  pointer-events:none;
}

@keyframes scan{
  0%{top:-5%}
  100%{top:105%}
}

.app{
  width:100%;
  max-width:1000px;
  height:100vh;
  margin:auto;
  padding:14px;
  display:flex;
  flex-direction:column;
  position:relative;
  z-index:1;
}

header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:10px 4px 13px;
  border-bottom:1px solid rgba(0,234,255,.3);
}

.logo{
  font-size:28px;
  font-weight:900;
  letter-spacing:7px;
  text-shadow:
    0 0 5px var(--cyan),
    0 0 20px var(--cyan),
    0 0 45px var(--blue);
}

.sub{
  font-size:9px;
  opacity:.55;
  letter-spacing:3px;
  margin-top:4px;
}

.status{
  display:flex;
  align-items:center;
  gap:7px;
  font-size:10px;
  letter-spacing:2px;
}

.dot{
  width:8px;
  height:8px;
  border-radius:50%;
  background:var(--green);
  box-shadow:0 0 12px var(--green);
}

.hero{
  height:300px;
  display:flex;
  align-items:center;
  justify-content:center;
  position:relative;
}

.core{
  width:130px;
  height:130px;
  border-radius:50%;
  border:2px solid var(--cyan);
  display:flex;
  align-items:center;
  justify-content:center;
  position:relative;
  box-shadow:
    0 0 15px var(--cyan),
    0 0 45px rgba(0,234,255,.35),
    inset 0 0 35px rgba(0,234,255,.3);
  animation:pulse 2.5s infinite;
}

.core:before{
  content:"";
  position:absolute;
  width:180px;
  height:180px;
  border-radius:50%;
  border:1px dashed rgba(0,234,255,.7);
  animation:spin 8s linear infinite;
}

.core:after{
  content:"";
  position:absolute;
  width:220px;
  height:220px;
  border-radius:50%;
  border:1px solid rgba(0,140,255,.35);
  border-left-color:transparent;
  border-right-color:transparent;
  animation:spin 12s linear reverse infinite;
}

.coreText{
  text-align:center;
  z-index:2;
}

.coreText b{
  display:block;
  font-size:19px;
  letter-spacing:4px;
}

.coreText span{
  display:block;
  margin-top:5px;
  font-size:8px;
  letter-spacing:2px;
  opacity:.7;
}

.orbit{
  position:absolute;
  width:255px;
  height:255px;
  border-radius:50%;
  border:1px solid rgba(0,234,255,.12);
  transform:rotate(25deg);
}

.orbit i{
  position:absolute;
  width:6px;
  height:6px;
  border-radius:50%;
  background:var(--cyan);
  box-shadow:0 0 15px var(--cyan);
  top:10px;
  left:50%;
}

@keyframes pulse{
  50%{
    transform:scale(1.06);
    box-shadow:
      0 0 25px var(--cyan),
      0 0 65px rgba(0,234,255,.45),
      inset 0 0 45px rgba(0,234,255,.4);
  }
}

@keyframes spin{
  to{transform:rotate(360deg)}
}

.panel{
  flex:1;
  min-height:0;
  border:1px solid rgba(0,234,255,.3);
  border-radius:14px;
  background:var(--panel);
  backdrop-filter:blur(12px);
  box-shadow:
    0 0 30px rgba(0,234,255,.05),
    inset 0 0 30px rgba(0,234,255,.025);
  overflow:hidden;
  display:flex;
  flex-direction:column;
}

.panelTop{
  padding:10px 13px;
  border-bottom:1px solid rgba(0,234,255,.15);
  font-size:9px;
  letter-spacing:2px;
  opacity:.7;
}

.chat{
  flex:1;
  min-height:0;
  overflow-y:auto;
  padding:13px;
  scroll-behavior:smooth;
}

.chat::-webkit-scrollbar{width:4px}
.chat::-webkit-scrollbar-thumb{background:var(--cyan)}

.msg{
  max-width:90%;
  margin:9px 0;
  padding:10px 12px;
  border-radius:9px;
  line-height:1.5;
  font-size:14px;
  animation:appear .25s ease;
}

@keyframes appear{
  from{opacity:0;transform:translateY(6px)}
  to{opacity:1;transform:translateY(0)}
}

.jarvis{
  color:var(--cyan);
  background:rgba(0,234,255,.045);
  border-left:2px solid var(--cyan);
}

.you{
  margin-left:auto;
  color:white;
  background:rgba(255,255,255,.045);
  border-right:2px solid white;
}

.label{
  font-size:9px;
  font-weight:bold;
  letter-spacing:2px;
  display:block;
  margin-bottom:3px;
  opacity:.65;
}

.controls{
  display:flex;
  gap:7px;
  padding:10px;
  border-top:1px solid rgba(0,234,255,.15);
}

input{
  flex:1;
  min-width:0;
  border:1px solid rgba(0,234,255,.45);
  background:rgba(0,8,14,.9);
  color:white;
  outline:none;
  border-radius:8px;
  padding:13px;
  font-size:14px;
}

input:focus{
  border-color:var(--cyan);
  box-shadow:0 0 15px rgba(0,234,255,.15);
}

button{
  border:1px solid rgba(0,234,255,.55);
  background:rgba(0,25,35,.8);
  color:var(--cyan);
  border-radius:8px;
  padding:0 15px;
  font-weight:bold;
  cursor:pointer;
  transition:.2s;
}

button:hover{
  background:rgba(0,234,255,.12);
  box-shadow:0 0 16px rgba(0,234,255,.3);
}

button:active{
  transform:scale(.94);
}

.mic{
  font-size:19px;
  width:55px;
}

.quick{
  display:flex;
  gap:6px;
  padding:0 10px 10px;
  overflow-x:auto;
}

.quick button{
  white-space:nowrap;
  font-size:10px;
  padding:8px 10px;
}

footer{
  text-align:center;
  font-size:8px;
  letter-spacing:3px;
  opacity:.4;
  padding:7px;
}

.listening{
  color:var(--green)!important;
  text-shadow:0 0 15px var(--green);
}

@media(max-width:600px){
  .logo{font-size:21px}
  .hero{height:235px}
  .core{width:110px;height:110px}
  .core:before{width:150px;height:150px}
  .core:after{width:185px;height:185px}
  .orbit{width:215px;height:215px}
  button.send{padding:0 12px}
}
</style>
</head>
