<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JARVIS AI</title>

<style>
*{box-sizing:border-box}

body{
    margin:0;
    min-height:100vh;
    overflow:hidden;
    background:#02070d;
    color:#00eaff;
    font-family:Arial,Helvetica,sans-serif;
}

body:before{
    content:"";
    position:fixed;
    inset:0;
    background:
      linear-gradient(rgba(0,234,255,.035) 1px,transparent 1px),
      linear-gradient(90deg,rgba(0,234,255,.035) 1px,transparent 1px);
    background-size:35px 35px;
    pointer-events:none;
}

.app{
    width:100%;
    height:100vh;
    display:flex;
    flex-direction:column;
}

header{
    height:65px;
    padding:0 20px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    border-bottom:1px solid #073844;
    background:rgba(2,12,19,.9);
}

.logo{
    font-size:24px;
    font-weight:bold;
    letter-spacing:5px;
    text-shadow:0 0 15px #00eaff;
}

.status{
    font-size:12px;
    color:#65ffb5;
}

.main{
    flex:1;
    min-height:0;
    display:flex;
    flex-direction:column;
    align-items:center;
}

.core-area{
    height:40%;
    min-height:250px;
    display:flex;
    align-items:center;
    justify-content:center;
    position:relative;
}

.core{
    width:145px;
    height:145px;
    border-radius:50%;
    border:2px solid #00eaff;
    position:relative;
    box-shadow:
        0 0 20px #00eaff,
        0 0 55px rgba(0,234,255,.55),
        inset 0 0 30px rgba(0,234,255,.4);
    animation:pulse 2s infinite;
}

.core:before,
.core:after{
    content:"";
    position:absolute;
    border:1px solid #00eaff;
    border-radius:50%;
}

.core:before{
    inset:-25px;
    animation:spin 7s linear infinite;
}

.core:after{
    inset:-45px;
    border-style:dashed;
    opacity:.6;
    animation:spin 12s linear infinite reverse;
}

.center{
    position:absolute;
    inset:35px;
    border-radius:50%;
    background:#00eaff;
    box-shadow:0 0 35px #00eaff;
}

.listening .core{
    animation:listen .45s infinite alternate;
    box-shadow:
        0 0 30px #00eaff,
        0 0 90px #00eaff;
}

.speaking .core{
    animation:speak .18s infinite alternate;
    box-shadow:
        0 0 35px #00eaff,
        0 0 110px #00eaff;
}

@keyframes pulse{
    50%{transform:scale(1.06)}
}

@keyframes listen{
    to{transform:scale(1.13)}
}

@keyframes speak{
    to{transform:scale(1.2)}
}

@keyframes spin{
    to{transform:rotate(360deg)}
}

.chat{
    width:min(900px,94%);
    flex:1;
    min-height:0;
    overflow-y:auto;
    padding:10px 5px 15px;
}

.msg{
    max-width:85%;
    margin:9px 0;
    padding:13px 16px;
    border:1px solid #073844;
    border-radius:12px;
    line-height:1.5;
    white-space:pre-wrap;
}

.jarvis{
    background:rgba(0,234,255,.055);
}

.user{
    margin-left:auto;
    color:white;
    background:rgba(255,255,255,.045);
    border-color:#25414a;
}

.label{
    margin-bottom:5px;
    font-size:10px;
    letter-spacing:2px;
    opacity:.6;
}

.controls{
    width:min(900px,94%);
    padding:12px 0 18px;
}

.input-row{
    display:flex;
    gap:8px;
}

input{
    flex:1;
    min-width:0;
    padding:15px;
    border:1px solid #075061;
    border-radius:10px;
    outline:none;
    background:#06121a;
    color:white;
    font-size:15px;
}

input:focus{
    border-color:#00eaff;
    box-shadow:0 0 12px rgba(0,234,255,.25);
}

button{
    border:1px solid #00eaff;
    border-radius:10px;
    padding:0 16px;
    background:#03151d;
    color:#00eaff;
    font-weight:bold;
    cursor:pointer;
}

button:hover{
    background:#00eaff;
    color:#001018;
    box-shadow:0 0 18px #00eaff;
}

.mic{
    width:55px;
    font-size:20px;
}

.quick{
    display:flex;
    gap:7px;
    margin-top:9px;
    overflow-x:auto;
}

.quick button{
    padding:9px 12px;
    font-size:11px;
    white-space:nowrap;
}

@media(max-width:600px){
    header{height:60px}
    .logo{font-size:19px}
    .core-area{
        height:32%;
        min-height:230px;
    }
    .core{
        width:115px;
        height:115px;
    }
    .center{inset:28px}
    .msg{
        max-width:92%;
        font-size:14px;
    }
}
</style>
</head>

<body>

<div class="app">

<header>
    <div class="logo">JARVIS</div>
    <div class="status" id="status">● ONLINE</div>
</header>

<div class="main">

    <div class="core-area" id="coreArea">
        <div class="core">
            <div class="center"></div>
        </div>
    </div>

    <div class="chat" id="chat">

        <div class="msg jarvis">
            <div class="label">JARVIS</div>
            Hello. I am JARVIS.<br>
            How can I assist you?
        </div>

    </div>

    <div class="controls">

        <div class="input-row">

            <input
                id="input"
                placeholder="Ask JARVIS anything..."
                autocomplete="off"
            >

            <button class="mic" id="mic">🎙️</button>

            <button id="send">SEND</button>

        </div>

        <div class="quick">
            <button onclick="ask('Who created you?')">CREATOR</button>
            <button onclick="ask('Tell me a joke')">JOKE</button>
            <button onclick="ask('What time is it?')">TIME</button>
            <button onclick="ask('Open YouTube')">YOUTUBE</button>
            <button onclick="ask('Open Google')">GOOGLE</button>
        </div>

    </div>

</div>
</div>


<script>

const input = document.getElementById("input");
const chat = document.getElementById("chat");
const coreArea = document.getElementById("coreArea");
const status = document.getElementById("status");


/* MESSAGE */

function addMessage(text,type){

    const box = document.createElement("div");

    box.className = "msg " + type;

    const label = type === "user" ? "YOU" : "JARVIS";

    box.innerHTML =
        `<div class="label">${label}</div>` +
        text.replace(/\n/g,"<br>");

    chat.appendChild(box);

    chat.scrollTop = chat.scrollHeight;
}


/* VOICE */

function speak(text){

    if(!("speechSynthesis" in window)){
        return;
    }

    speechSynthesis.cancel();

    const clean = text
        .replace(/[*#`]/g,"")
        .replace(/<[^>]*>/g,"");

    const voice = new SpeechSynthesisUtterance(clean);

    voice.lang = "en-US";
    voice.rate = 0.95;
    voice.pitch = 1;
    voice.volume = 1;

    voice.onstart = () => {

        coreArea.classList.add("speaking");

        status.textContent = "● SPEAKING";
        status.style.color = "#00eaff";

    };

    voice.onend = () => {

        coreArea.classList.remove("speaking");

        status.textContent = "● ONLINE";
        status.style.color = "#65ffb5";

    };

    speechSynthesis.speak(voice);
}


/* OPEN WEBSITE */

function openSite(name,url){

    addMessage("Opening " + name + "...","jarvis");

    setTimeout(() => {
        window.location.href = url;
    },300);
}


/* COMMAND SYSTEM */

function localCommand(text){

    const t = text.toLowerCase().trim();


    /* CREATOR COMMANDS */

    if(
        t.includes("who created you") ||
        t.includes("who made you") ||
        t.includes("who built you") ||
        t.includes("who is your creator") ||
        t.includes("who made jarvis") ||
        t.includes("who created jarvis") ||
        t.includes("who built jarvis") ||
        t.includes("tell me about munkhtur") ||
        t.includes("munkhtur") ||
        t.includes("creator")
    ){

        const r =
        "I was created and built by Munkhtur. " +
        "He is the creator of this JARVIS project. " +
        "He built it with creativity, ambition and a strong interest in technology.";

        addMessage(r,"jarvis");
        speak(r);

        return true;
    }


    /* WEBSITE COMMANDS */

    if(t.includes("open youtube")){

        openSite(
            "YouTube",
            "https://www.youtube.com"
        );

        return true;
    }


    if(t.includes("open google")){

        openSite(
            "Google",
            "https://www.google.com"
        );

        return true;
    }


    if(t.includes("open facebook")){

        openSite(
            "Facebook",
            "https://www.facebook.com"
        );

        return true;
    }


    if(t.includes("open instagram")){

        openSite(
            "Instagram",
            "https://www.instagram.com"
        );

        return true;
    }


    if(t.includes("open messenger")){

        openSite(
            "Messenger",
            "https://www.messenger.com"
        );

        return true;
    }


    if(t.includes("open roblox")){

        openSite(
            "Roblox",
            "https://www.roblox.com"
        );

        return true;
    }


    if(t.includes("open tiktok")){

        openSite(
            "TikTok",
            "https://www.tiktok.com"
        );

        return true;
    }


    if(t.includes("open spotify")){

        openSite(
            "Spotify",
            "https://open.spotify.com"
        );

        return true;
    }


    if(t.includes("open minecraft")){

        openSite(
            "Minecraft",
            "https://www.minecraft.net"
        );

        return true;
    }


    /* TIME */

    if(
        t.includes("what time is it") ||
        t === "time" ||
        t.includes("current time")
    ){

        const r =
            "The current time is " +
            new Date().toLocaleTimeString();

        addMessage(r,"jarvis");
        speak(r);

        return true;
    }


    /* DATE */

    if(
        t.includes("what is the date") ||
        t.includes("what's the date") ||
        t === "date"
    ){

        const r =
            "Today is " +
            new Date().toLocaleDateString();

        addMessage(r,"jarvis");
        speak(r);

        return true;
    }


    /* JOKES */

    if(
        t.includes("tell me a joke") ||
        t.includes("tell joke") ||
        t === "joke"
    ){

        const jokes = [

            "Why did the computer go to the doctor? Because it had a virus.",

            "I told my computer I needed a break. Now it keeps showing me vacation ads.",

            "Why was the math book sad? Because it had too many problems.",

            "Why did the programmer quit his job? Because he didn't get arrays."

        ];

        const r =
            jokes[Math.floor(Math.random()*jokes.length)];

        addMessage(r,"jarvis");
        speak(r);

        return true;
    }


    /* GREETINGS */

    if(
        t === "hello" ||
        t === "hi" ||
        t.includes("hello jarvis") ||
        t.includes("hey jarvis")
    ){

        const r =
            "Hello. I am JARVIS. How can I assist you?";

        addMessage(r,"jarvis");
        speak(r);

        return true;
    }


    /* WHO ARE YOU */

    if(
        t.includes("who are you") ||
        t.includes("what are you")
    ){

        const r =
            "I am JARVIS, a futuristic AI assistant created by Munkhtur.";

        addMessage(r,"jarvis");
        speak(r);

        return true;
    }


    return false;
}


/* ASK */

function ask(text){

    input.value = "";

    addMessage(text,"user");

    if(localCommand(text)){
        return;
    }


    const reply =
        "I understand your question, but my full AI brain is not connected yet. " +
        "You can still use my voice, microphone, animations and commands.";

    setTimeout(() => {

        addMessage(reply,"jarvis");

        speak(reply);

    },400);
}


/* SEND BUTTON */

document.getElementById("send").onclick = () => {

    const text = input.value.trim();

    if(text){
        ask(text);
    }

};


/* ENTER KEY */

input.addEventListener("keydown",e => {

    if(e.key === "Enter"){

        const text = input.value.trim();

        if(text){
            ask(text);
        }

    }

});


/* MICROPHONE */

let recognition = null;
let listening = false;

const SpeechRecognition =
    window.SpeechRecognition ||
    window.webkitSpeechRecognition;


if(SpeechRecognition){

    recognition = new SpeechRecognition();

    recognition.lang = "en-US";

    recognition.continuous = false;

    recognition.interimResults = false;


    recognition.onstart = () => {

        listening = true;

        coreArea.classList.add("listening");

        status.textContent = "● LISTENING";

        status.style.color = "#00eaff";

    };


    recognition.onresult = e => {

        const text =
            e.results[0][0].transcript;

        input.value = text;

        ask(text);

    };
