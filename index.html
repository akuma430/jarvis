<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JARVIS AI</title>

<style>
*{box-sizing:border-box}

body{
    margin:0;
    background:#02070b;
    color:#00eaff;
    font-family:Arial,sans-serif;
    min-height:100vh;
    overflow:hidden;
}

body:before{
    content:"";
    position:fixed;
    inset:0;
    background:
      linear-gradient(rgba(0,234,255,.035) 1px,transparent 1px),
      linear-gradient(90deg,rgba(0,234,255,.035) 1px,transparent 1px);
    background-size:35px 35px;
    pointer-events:none;
}

.app{
    width:100%;
    max-width:900px;
    height:100vh;
    margin:auto;
    display:flex;
    flex-direction:column;
    padding:18px;
}

.header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    border-bottom:1px solid #075b68;
    padding-bottom:14px;
}

.logo{
    font-size:26px;
    font-weight:bold;
    letter-spacing:6px;
    text-shadow:0 0 15px #00eaff;
}

.status{
    font-size:12px;
    letter-spacing:2px;
}

.dot{
    display:inline-block;
    width:9px;
    height:9px;
    background:#00ff88;
    border-radius:50%;
    box-shadow:0 0 12px #00ff88;
    margin-right:7px;
}

.core-area{
    display:flex;
    justify-content:center;
    align-items:center;
    height:280px;
}

.core{
    width:145px;
    height:145px;
    border:2px solid #00eaff;
    border-radius:50%;
    display:flex;
    justify-content:center;
    align-items:center;
    position:relative;
    box-shadow:0 0 25px #00eaff, inset 0 0 30px #00eaff;
    animation:pulse 2s infinite;
}

.core:before,
.core:after{
    content:"";
    position:absolute;
    border:1px solid #00eaff;
    border-radius:50%;
}

.core:before{
    width:190px;
    height:190px;
    animation:spin 8s linear infinite;
}

.core:after{
    width:115px;
    height:115px;
    animation:spin 5s linear reverse infinite;
}

.core span{
    font-size:18px;
    font-weight:bold;
    letter-spacing:3px;
}

@keyframes pulse{
    50%{transform:scale(1.06)}
}

@keyframes spin{
    to{transform:rotate(360deg)}
}

.chat{
    flex:1;
    min-height:0;
    border:1px solid #075b68;
    background:rgba(0,20,27,.55);
    box-shadow:inset 0 0 25px rgba(0,234,255,.04);
    overflow-y:auto;
    padding:15px;
    border-radius:10px;
}

.msg{
    margin:10px 0;
    line-height:1.5;
}

.user{
    color:#fff;
}

.jarvis{
    color:#00eaff;
}

.label{
    font-weight:bold;
    letter-spacing:2px;
}

.controls{
    display:flex;
    gap:8px;
    margin-top:12px;
}

input{
    flex:1;
    min-width:0;
    background:#020b10;
    border:1px solid #087487;
    color:#fff;
    padding:14px;
    border-radius:7px;
    outline:none;
    font-size:15px;
}

button{
    background:#03151b;
    color:#00eaff;
    border:1px solid #00a8bd;
    padding:12px 16px;
    border-radius:7px;
    cursor:pointer;
    font-weight:bold;
}

button:hover{
    background:#06313a;
    box-shadow:0 0 12px #00eaff;
}

.mic{
    min-width:55px;
}

.footer{
    text-align:center;
    font-size:10px;
    opacity:.55;
    padding-top:10px;
    letter-spacing:2px;
}

.listening{
    animation:pulse .7s infinite;
    color:#00ff88;
}

@media(max-width:600px){
    .logo{font-size:20px}
    .core-area{height:230px}
    .core{width:120px;height:120px}
    .core:before{width:160px;height:160px}
    .core:after{width:95px;height:95px}
    .controls{flex-wrap:wrap}
    input{flex-basis:100%}
    button{flex:1}
}
</style>
</head>

<body>

<div class="app">

    <div class="header">
        <div class="logo">JARVIS</div>
        <div class="status">
            <span class="dot"></span>
            <span id="status">ONLINE</span>
        </div>
    </div>

    <div class="core-area">
        <div class="core" id="core">
            <span>JARVIS</span>
        </div>
    </div>

    <div class="chat" id="chat">
        <div class="msg jarvis">
            <span class="label">JARVIS:</span>
            System online. Awaiting your command.
        </div>
    </div>

    <div class="controls">
        <input id="input" placeholder="Speak or type a command...">
        <button onclick="send()">SEND</button>
        <button class="mic" onclick="listen()">🎙️</button>
    </div>

    <div class="footer">
        JARVIS PERSONAL AI SYSTEM
    </div>

</div>

<script>

const chat = document.getElementById("chat");
const input = document.getElementById("input");
const status = document.getElementById("status");
const core = document.getElementById("core");

function addMessage(type,text){

    const div = document.createElement("div");

    div.className = "msg " + type;

    div.innerHTML =
        '<span class="label">' +
        (type === "user" ? "YOU:" : "JARVIS:") +
        '</span> ' +
        escapeHTML(text);

    chat.appendChild(div);

    chat.scrollTop = chat.scrollHeight;
}

function escapeHTML(text){

    return text
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");
}

function speak(text){

    if(!("speechSynthesis" in window)) return;

    speechSynthesis.cancel();

    const voice = new SpeechSynthesisUtterance(text);

    voice.lang = "en-US";
    voice.rate = 0.95;
    voice.pitch = 0.9;
    voice.volume = 1;

    speechSynthesis.speak(voice);
}

function reply(text){

    addMessage("jarvis",text);
    speak(text);
}

function send(){

    const text = input.value.trim();

    if(!text) return;

    addMessage("user",text);

    input.value = "";

    process(text.toLowerCase());
}

function process(command){

    if(command.includes("hello") ||
       command.includes("hi") ||
       command.includes("hey")){

        reply("Hello. I am JARVIS. How can I assist you?");
        return;
    }

    if(command.includes("who are you") ||
       command.includes("what are you")){

        reply("I am JARVIS, your personal artificial intelligence assistant.");
        return;
    }

    if(command.includes("time")){

        const time = new Date().toLocaleTimeString(
            [],
            {hour:"2-digit",minute:"2-digit"}
        );

        reply("The current time is " + time + ".");
        return;
    }

    if(command.includes("date")){

        const date = new Date().toLocaleDateString(
            [],
            {year:"numeric",month:"long",day:"numeric"}
        );

        reply("Today is " + date + ".");
        return;
    }

    if(command.includes("google")){

        reply("Opening Google.");

        setTimeout(()=>{
            window.open("https://www.google.com","_blank");
        },500);

        return;
    }

    if(command.includes("youtube")){

        reply("Opening YouTube.");

        setTimeout(()=>{
            window.open("https://www.youtube.com","_blank");
        },500);

        return;
    }

    if(command.includes("thank")){

        reply("You're welcome.");
        return;
    }

    if(command.includes("clear")){

        chat.innerHTML = "";
        reply("Terminal cleared.");
        return;
    }

    reply(
        "I heard you say: " +
        command +
        ". My advanced AI brain is not connected yet."
    );
}

const Recognition =
    window.SpeechRecognition ||
    window.webkitSpeechRecognition;

let recognition = null;

if(Recognition){

    recognition = new Recognition();

    recognition.lang = "en-US";
    recognition.continuous = false;
    recognition.interimResults = false;

    recognition.onstart = function(){

        status.textContent = "LISTENING";
        status.classList.add("listening");
        core.style.transform = "scale(1.12)";
    };

    recognition.onresult = function(event){

        const text =
            event.results[0][0].transcript;

        input.value = text;

        addMessage("user",text);

        process(text.toLowerCase());
    };

    recognition.onerror = function(){

        status.textContent = "MIC ERROR";
        status.classList.remove("listening");

        reply(
            "I could not access the microphone. Please check microphone permission."
        );
    };

    recognition.onend = function(){

        status.textContent = "ONLINE";
        status.classList.remove("listening");
        core.style.transform = "";
    };

}

function listen(){

    if(!recognition){

        reply(
            "Voice recognition is not supported by this browser."
        );

        return;
    }

    try{

        recognition.start();

    }catch(error){

        recognition.stop();

    }
}

input.addEventListener("keydown",function(event){

    if(event.key === "Enter"){

        send();

    }

});

</script>

</body>
</html>
